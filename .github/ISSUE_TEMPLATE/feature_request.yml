name: Feature request
description: Suggest something Project Brain should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting?
      description: |
        Describe the situation, not the solution. The most useful reports start
        with "I have N projects and I cannot ..." rather than "add a --flag".
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: Including "I just re-derive it every time" — that is a real answer.

  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
      description: Optional.
