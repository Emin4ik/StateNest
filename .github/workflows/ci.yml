name: CI

on:
  push:
    branches: [main]
  pull_request:

# Project Brain reads the filesystem and shells out to git, so the matrix is
# not ceremony: path handling, atomic renames and git behaviour all differ
# between these platforms, and every one of them is a supported target.
jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.12', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check for raw control bytes in source
        run: npm run check:bytes

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the CLI runs from the build
        shell: bash
        run: |
          node dist/cli/bin.js --version
          node dist/cli/bin.js --help > /dev/null

      - name: Verify the plugin entry points have no runtime dependencies
        shell: bash
        run: |
          # The plugin root has no node_modules when Claude Code loads it in
          # place, so the bundles must resolve nothing. Run them from a
          # directory with no node_modules above it to prove it.
          TMP="$(mktemp -d)"
          cp -r dist-plugin "$TMP/"
          echo '{}' | node "$TMP/dist-plugin/hook.js" session-start
          echo "hook ran with no dependencies available"

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pack and inspect the tarball
        run: |
          npm pack --dry-run
          npm pack
          tar -tzf project-brain-*.tgz | sort

      - name: Install the packed tarball into a clean prefix
        run: |
          PREFIX="$(mktemp -d)"
          npm install -g --prefix "$PREFIX" ./project-brain-*.tgz
          "$PREFIX/bin/pb" --version
          "$PREFIX/bin/pb" doctor || true

      - name: Validate the Claude Code plugin manifest
        run: |
          node -e "
            const fs = require('node:fs');
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
            const market = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            const hooks = JSON.parse(fs.readFileSync('hooks/hooks.json', 'utf8'));
            const mcp = JSON.parse(fs.readFileSync('.mcp.json', 'utf8'));

            if (!/^[a-z0-9-]+\$/.test(plugin.name)) throw new Error('plugin name must be kebab-case');
            if (!market.plugins?.length) throw new Error('marketplace lists no plugins');
            if (!hooks.hooks) throw new Error('hooks.json must have an outer { hooks: ... } wrapper');
            if (!mcp.mcpServers) throw new Error('.mcp.json must declare mcpServers');

            for (const [event, entries] of Object.entries(hooks.hooks)) {
              for (const entry of entries) {
                for (const handler of entry.hooks) {
                  if (!handler.args) throw new Error(event + ': use exec form (args array), not shell form');
                  const target = handler.args[0];
                  if (!target.startsWith('\${CLAUDE_PLUGIN_ROOT}/')) {
                    throw new Error(event + ': hook must be addressed via \${CLAUDE_PLUGIN_ROOT}');
                  }
                }
              }
            }
            console.log('plugin manifests are valid');
          "
