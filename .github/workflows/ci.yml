name: CI

on:
  push:
    branches: [main]
  pull_request:

# StateNest reads the filesystem and shells out to git, so the matrix is
# not ceremony: path handling, atomic renames and git behaviour all differ
# between these platforms, and every one of them is a supported target.
jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.12', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check for raw control bytes in source
        run: npm run check:bytes

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the CLI runs from the build
        shell: bash
        run: |
          node dist/cli/bin.js --version
          node dist/cli/bin.js --help > /dev/null

      - name: Verify the plugin entry points have no runtime dependencies
        # Node rather than shell: `mktemp -d` under Git Bash on Windows returns
        # a path the native node.exe cannot resolve, which fails for a reason
        # that has nothing to do with the bundle.
        run: |
          node -e "
            const fs = require('node:fs');
            const os = require('node:os');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'plugin-isolated-'));
            fs.cpSync('dist-plugin', path.join(tmp, 'dist-plugin'), { recursive: true });
            const out = execFileSync(process.execPath,
              [path.join(tmp, 'dist-plugin', 'hook.js'), 'session-start'],
              { cwd: tmp, input: '{}', encoding: 'utf8' });
            if (out.trim() !== '') throw new Error('unexpected output: ' + out);
            console.log('hook ran with no dependencies available');
          "

  # Part F: the real tarball, installed and driven on every supported OS.
  #
  # Running the suite from a checkout proves the code works; it does not prove
  # the thing users install works. The global bin layout alone differs —
  # POSIX puts the shim in `<prefix>/bin`, Windows puts it in `<prefix>` — so
  # this is a Node script rather than shell, because encoding those
  # differences in YAML is how a workflow passes on one runner and lies on
  # another.
  package:
    name: Package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Inspect the tarball contents
        shell: bash
        run: npm pack --dry-run

      - name: Install the packed tarball and drive the CLI
        run: npm run smoke:install

      - name: Validate the Claude Code plugin manifest
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
            const market = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            const hooks = JSON.parse(fs.readFileSync('hooks/hooks.json', 'utf8'));
            const mcp = JSON.parse(fs.readFileSync('.mcp.json', 'utf8'));

            if (!/^[a-z0-9-]+\$/.test(plugin.name)) throw new Error('plugin name must be kebab-case');
            if (!market.plugins?.length) throw new Error('marketplace lists no plugins');
            if (!hooks.hooks) throw new Error('hooks.json must have an outer { hooks: ... } wrapper');
            if (!mcp.mcpServers) throw new Error('.mcp.json must declare mcpServers');

            for (const [event, entries] of Object.entries(hooks.hooks)) {
              for (const entry of entries) {
                for (const handler of entry.hooks) {
                  if (!handler.args) throw new Error(event + ': use exec form (args array), not shell form');
                  const target = handler.args[0];
                  if (!target.startsWith('\${CLAUDE_PLUGIN_ROOT}/')) {
                    throw new Error(event + ': hook must be addressed via \${CLAUDE_PLUGIN_ROOT}');
                  }
                }
              }
            }
            console.log('plugin manifests are valid');
          "

  # The single gate a release must pass.
  #
  # Everything above proves the code works on each platform. This job answers a
  # different question — may this be published? — and it is deliberately one
  # command, so that "it passed CI" and "it is releasable" cannot drift apart.
  #
  # It fails today, on purpose: `check:metadata` refuses while the project name
  # and repository owner are placeholders. See docs/release-readiness.md.
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - run: npm ci

      - name: npm run release:check
        run: npm run release:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Refuse install-time scripts in the dependency tree
        run: |
          # A postinstall script in a transitive dependency is arbitrary code
          # execution on every user's machine at install time. There are none
          # today; this keeps it that way.
          node -e "
            const { execFileSync } = require('node:child_process');
            const fs = require('node:fs');
            const path = require('node:path');
            const tree = JSON.parse(
              execFileSync('npm', ['ls', '--omit=dev', '--all', '--json'], {
                maxBuffer: 64 * 1024 * 1024,
              }).toString(),
            );
            const names = new Set();
            (function walk(node) {
              for (const [name, dep] of Object.entries(node.dependencies ?? {})) {
                if (!names.has(name)) { names.add(name); walk(dep); }
              }
            })(tree);
            const offenders = [];
            for (const name of names) {
              const file = path.join('node_modules', name, 'package.json');
              if (!fs.existsSync(file)) continue;
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              for (const hook of ['preinstall', 'install', 'postinstall']) {
                if (pkg.scripts?.[hook]) offenders.push(name + ' -> ' + hook);
              }
            }
            if (offenders.length) {
              console.error('Install-time scripts found:\n  ' + offenders.join('\n  '));
              process.exit(1);
            }
            console.log('No install-time scripts in ' + names.size + ' production packages.');
          "
